name: Bug report
description: Report a reproducible defect in ItemGraph.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real player data, private coordinates, databases,
        credentials, tokens, or unredacted server logs.
  - type: input
    id: itemgraph-version
    attributes:
      label: ItemGraph version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft, NeoForge, Java, and dependency versions
      placeholder: Minecraft 1.21.1; NeoForge 21.1.248; Java 21
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest synthetic scenario that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant command output or logs after removing private data and secrets.
    validations:
      required: false
