name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Validate tag matches project version
        id: version_data
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"

          if [[ -z "${VERSION}" || "${VERSION}" == "${TAG_NAME}" ]]; then
            echo "Tag must use the v<version> format; received: ${TAG_NAME}" >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Release tag ${VERSION} does not match gradle.properties mod_version ${PROJECT_VERSION}" >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run automated test suite and build release jar
        run: ./gradlew clean build

      - name: Extract release changelog
        shell: bash
        run: |
          VERSION="${{ steps.version_data.outputs.version }}"
          SECTION="## [${VERSION}]"

          awk -v section="${SECTION}" '
            {
              line = $0
              sub(/\r$/, "", line)
              if (line ~ /^## \[/) {
                if (in_section && index(line, section) != 1) { exit }
                if (index(line, section) == 1) { in_section = 1 }
              }
              if (in_section) { print line }
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md does not contain release section: ${SECTION}" >&2
            exit 1
          fi

      - name: Publish to GitHub Releases
        id: publish_github
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version_data.outputs.tag_name }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          version: ${{ steps.version_data.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

      - name: Publish to CurseForge
        id: publish_curseforge
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          version: ${{ steps.version_data.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

          game-versions: |
            1.21.1

          loaders: |
            neoforge

          environment: dedicated-server

          java: |
            21

          dependencies: |
            grieflogger(optional){curseforge:435029}

      - name: Publish to Modrinth
        id: publish_modrinth
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          version: ${{ steps.version_data.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

          game-versions: |
            1.21.1

          loaders: |
            neoforge

          environment: dedicated-server

          java: |
            21

          dependencies: |
            grieflogger(optional){curseforge:435029}

      - name: Write publication summary
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_URL: ${{ steps.publish_github.outputs.github-url }}
          CURSEFORGE_URL: ${{ steps.publish_curseforge.outputs.curseforge-url }}
          CURSEFORGE_VERSION: ${{ steps.publish_curseforge.outputs.curseforge-version }}
          MODRINTH_URL: ${{ steps.publish_modrinth.outputs.modrinth-url }}
          MODRINTH_VERSION: ${{ steps.publish_modrinth.outputs.modrinth-version }}
        run: |
          {
            echo "## Publication results"
            echo
            echo "- GitHub: ${GITHUB_URL:-not published}"
            echo "- CurseForge: ${CURSEFORGE_URL:-not published} (${CURSEFORGE_VERSION:-no file id})"
            echo "- Modrinth: ${MODRINTH_URL:-not published} (${MODRINTH_VERSION:-no version id})"
          } >> "${GITHUB_STEP_SUMMARY}"
