name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Validate tag matches project version
        id: version_data
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"

          if [[ -z "${VERSION}" || "${VERSION}" == "${TAG_NAME}" ]]; then
            echo "Tag must use the v<version> format; received: ${TAG_NAME}" >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Release tag ${VERSION} does not match gradle.properties mod_version ${PROJECT_VERSION}" >&2
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run automated test suite and build release jar
        run: ./gradlew clean build

      - name: Publish to Modrinth, CurseForge, and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version_data.outputs.tag_name }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          version: ${{ steps.version_data.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md

          game-versions: |
            1.21.1

          loaders: |
            neoforge

          java: |
            21

          dependencies: |
            grieflogger(required)
            architectury-api(required)
            supermartijn642s-config-lib(required)
