name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Validate tag matches project version
        id: version_data
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"

          if [[ -z "${VERSION}" || "${VERSION}" == "${TAG_NAME}" ]]; then
            echo "Tag must use the v<version> format; received: ${TAG_NAME}" >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Release tag ${VERSION} does not match gradle.properties mod_version ${PROJECT_VERSION}" >&2
            exit 1
          fi

          case "${VERSION}" in
            *alpha*) VERSION_TYPE=alpha ;;
            *beta*|*rc*) VERSION_TYPE=beta ;;
            *) VERSION_TYPE=release ;;
          esac
          if [[ "${VERSION_TYPE}" == "release" ]]; then
            GITHUB_VERSION_TYPE=release
          else
            GITHUB_VERSION_TYPE=prerelease
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_type=${VERSION_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "github_version_type=${GITHUB_VERSION_TYPE}" >> "${GITHUB_OUTPUT}"

      - name: Test and build all loader artifacts
        run: ./gradlew clean build

      - name: Extract release changelog
        shell: bash
        run: |
          VERSION="${{ steps.version_data.outputs.version }}"
          SECTION="## [${VERSION}]"

          awk -v section="${SECTION}" '
            {
              line = $0
              sub(/\r$/, "", line)
              if (line ~ /^## \[/) {
                if (in_section && index(line, section) != 1) { exit }
                if (index(line, section) == 1) { in_section = 1 }
              }
              if (in_section) { print line }
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md does not contain release section: ${SECTION}" >&2
            exit 1
          fi

      - name: Check Modrinth project availability
        id: modrinth_gate
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "status=missing-token" >> "${GITHUB_OUTPUT}"
            echo "Modrinth publication disabled: MODRINTH_TOKEN is not configured."
            exit 0
          fi

          project_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/itemgraph" 2>/dev/null || true)"
          versions_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/itemgraph/version" 2>/dev/null || true)"

          echo "status=project:${project_status},versions:${versions_status}" >> "${GITHUB_OUTPUT}"
          if [[ "${project_status}" =~ ^2[0-9][0-9]$ && "${versions_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Modrinth publication enabled: project and versions APIs returned successful responses."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Modrinth publication disabled: project=${project_status}, versions=${versions_status}."
          fi

      - name: Publish all jars to GitHub Releases
        id: publish_github
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version_data.outputs.tag_name }}
          github-files: |
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          github-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric and NeoForge 1.21.1)
          github-version: ${{ steps.version_data.outputs.version }}
          github-version-type: ${{ steps.version_data.outputs.github_version_type }}
          github-changelog-file: release-notes.md

      - name: Publish Fabric standard build
        id: publish_fabric
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
          curseforge-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1)
          curseforge-version: ${{ steps.version_data.outputs.version }}
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            fabric
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger(optional){modrinth:grieflogger}{curseforge:435029}

      - name: Publish Fabric standard build to Modrinth
        id: publish_fabric_modrinth
        if: ${{ !cancelled() && steps.modrinth_gate.outputs.enabled == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1)
          modrinth-version: '${{ steps.version_data.outputs.version }}+fabric'
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            fabric
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger(optional){modrinth:grieflogger}{curseforge:435029}

      - name: Publish Fabric GriefLogger-compatible build
        id: publish_fabric_grieflogger
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
          curseforge-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1, GriefLogger 1.2.10 compatible)
          curseforge-version: ${{ steps.version_data.outputs.version }}
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            fabric
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}{curseforge:435029}

      - name: Publish Fabric GriefLogger-compatible build to Modrinth
        id: publish_fabric_grieflogger_modrinth
        if: ${{ !cancelled() && steps.modrinth_gate.outputs.enabled == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1, GriefLogger 1.2.10 compatible)
          modrinth-version: '${{ steps.version_data.outputs.version }}+fabric-gl'
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            fabric
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}{curseforge:435029}

      - name: Publish NeoForge standard build
        id: publish_neoforge
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
          curseforge-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          curseforge-version: ${{ steps.version_data.outputs.version }}
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger(optional){modrinth:grieflogger}{curseforge:435029}

      - name: Publish NeoForge standard build to Modrinth
        id: publish_neoforge_modrinth
        if: ${{ !cancelled() && steps.modrinth_gate.outputs.enabled == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          modrinth-version: '${{ steps.version_data.outputs.version }}+neoforge'
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger(optional){modrinth:grieflogger}{curseforge:435029}

      - name: Publish NeoForge GriefLogger-compatible build
        id: publish_neoforge_grieflogger
        if: ${{ !cancelled() }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          curseforge-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1, GriefLogger 1.2.10 compatible)
          curseforge-version: ${{ steps.version_data.outputs.version }}
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}{curseforge:435029}

      - name: Publish NeoForge GriefLogger-compatible build to Modrinth
        id: publish_neoforge_grieflogger_modrinth
        if: ${{ !cancelled() && steps.modrinth_gate.outputs.enabled == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1, GriefLogger 1.2.10 compatible)
          modrinth-version: '${{ steps.version_data.outputs.version }}+neoforge-gl'
          version-type: ${{ steps.version_data.outputs.version_type }}
          changelog-file: release-notes.md
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          environment: dedicated-server
          java: |
            21
          dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}{curseforge:435029}

      - name: Write publication summary
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_URL: ${{ steps.publish_github.outputs.github-url }}
          MODRINTH_STATUS: ${{ steps.modrinth_gate.outputs.status }}
          FABRIC_CURSEFORGE_URL: ${{ steps.publish_fabric.outputs.curseforge-url }}
          FABRIC_MODRINTH_URL: ${{ steps.publish_fabric_modrinth.outputs.modrinth-url }}
          FABRIC_GL_CURSEFORGE_URL: ${{ steps.publish_fabric_grieflogger.outputs.curseforge-url }}
          FABRIC_GL_MODRINTH_URL: ${{ steps.publish_fabric_grieflogger_modrinth.outputs.modrinth-url }}
          NEOFORGE_CURSEFORGE_URL: ${{ steps.publish_neoforge.outputs.curseforge-url }}
          NEOFORGE_MODRINTH_URL: ${{ steps.publish_neoforge_modrinth.outputs.modrinth-url }}
          NEOFORGE_GL_CURSEFORGE_URL: ${{ steps.publish_neoforge_grieflogger.outputs.curseforge-url }}
          NEOFORGE_GL_MODRINTH_URL: ${{ steps.publish_neoforge_grieflogger_modrinth.outputs.modrinth-url }}
        run: |
          {
            echo "## Publication results"
            echo
            echo "- GitHub: ${GITHUB_URL:-not published}"
            echo "- Modrinth gate: ${MODRINTH_STATUS:-not evaluated}"
            echo "- CurseForge Fabric: ${FABRIC_CURSEFORGE_URL:-not published}"
            echo "- Modrinth Fabric: ${FABRIC_MODRINTH_URL:-not published}"
            echo "- CurseForge Fabric GriefLogger-compatible: ${FABRIC_GL_CURSEFORGE_URL:-not published}"
            echo "- Modrinth Fabric GriefLogger-compatible: ${FABRIC_GL_MODRINTH_URL:-not published}"
            echo "- CurseForge NeoForge: ${NEOFORGE_CURSEFORGE_URL:-not published}"
            echo "- Modrinth NeoForge: ${NEOFORGE_MODRINTH_URL:-not published}"
            echo "- CurseForge NeoForge GriefLogger-compatible: ${NEOFORGE_GL_CURSEFORGE_URL:-not published}"
            echo "- Modrinth NeoForge GriefLogger-compatible: ${NEOFORGE_GL_MODRINTH_URL:-not published}"
          } >> "${GITHUB_STEP_SUMMARY}"
