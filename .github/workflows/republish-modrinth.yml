name: Retry Modrinth Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing ItemGraph release version without the leading v
        required: true
        type: string
      variant:
        description: Which Modrinth artifact to publish (choose one to resume a partial run safely)
        required: true
        type: choice
        options:
          - all
          - fabric
          - fabric-grieflogger-compatible
          - neoforge
          - neoforge-grieflogger-compatible

permissions:
  contents: read

jobs:
  publish-modrinth:
    runs-on: ubuntu-latest
    concurrency:
      group: modrinth-republish-${{ inputs.version }}
      cancel-in-progress: false

    steps:
      - name: Resolve existing release tag
        id: version_data
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${REQUESTED_VERSION}"
          TAG_NAME="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Requested version must be a plain semantic version such as 0.3.2; received: ${REQUESTED_VERSION}" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code "https://github.com/${REPOSITORY}.git" "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Release tag ${TAG_NAME} does not exist on origin" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Checkout requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version_data.outputs.tag_name }}

      - name: Validate tag version matches project version
        shell: bash
        env:
          VERSION: ${{ steps.version_data.outputs.version }}
        run: |
          PROJECT_VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"
          if [[ "${VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Release version ${VERSION} does not match gradle.properties mod_version ${PROJECT_VERSION}" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Test and build all loader artifacts
        run: ./gradlew clean build

      - name: Extract release changelog
        shell: bash
        env:
          VERSION: ${{ steps.version_data.outputs.version }}
        run: |
          SECTION="## [${VERSION}]"
          awk -v section="${SECTION}" '
            {
              line = $0
              sub(/\r$/, "", line)
              if (line ~ /^## \[/) {
                if (in_section && index(line, section) != 1) { exit }
                if (line == section || (index(line, section) == 1 && substr(line, length(section) + 1, 1) ~ /[[:space:]—]/)) { in_section = 1 }
              }
              if (in_section) { print line }
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md does not contain release section: ${SECTION}" >&2
            exit 1
          fi

      - name: Ensure selected Modrinth versions are not already published
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version_data.outputs.version }}
          VARIANT: ${{ inputs.variant }}
        run: |
          case "${VARIANT}" in
            all) VERSIONS=("${VERSION}+fabric" "${VERSION}+fabric-gl" "${VERSION}+neoforge" "${VERSION}+neoforge-gl") ;;
            fabric) VERSIONS=("${VERSION}+fabric") ;;
            fabric-grieflogger-compatible) VERSIONS=("${VERSION}+fabric-gl") ;;
            neoforge) VERSIONS=("${VERSION}+neoforge") ;;
            neoforge-grieflogger-compatible) VERSIONS=("${VERSION}+neoforge-gl") ;;
            *) echo "Unsupported variant: ${VARIANT}" >&2; exit 1 ;;
          esac

          PUBLISHED_VERSIONS="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/itemgraph/version")"

          if ! python3 -c '
          import json
          import sys

          wanted = set(sys.argv[1:])
          published = {version["version_number"] for version in json.load(sys.stdin)}
          duplicates = sorted(wanted & published)
          if duplicates:
              print("Modrinth versions already exist: " + ", ".join(duplicates) + "; select only missing variants.", file=sys.stderr)
              sys.exit(1)
          ' "${VERSIONS[@]}" <<< "${PUBLISHED_VERSIONS}"; then
            exit 1
          fi

      - name: Publish Fabric standard build to Modrinth
        id: publish_fabric
        if: ${{ inputs.variant == 'all' || inputs.variant == 'fabric' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1)
          modrinth-version: '${{ steps.version_data.outputs.version }}+fabric'
          modrinth-version-type: release
          modrinth-changelog-file: release-notes.md
          modrinth-game-versions: |
            1.21.1
          modrinth-loaders: |
            fabric
          modrinth-environment: dedicated-server
          modrinth-java: |
            21
          modrinth-dependencies: |
            grieflogger(optional){modrinth:grieflogger}

      - name: Publish Fabric GriefLogger-compatible build to Modrinth
        id: publish_fabric_grieflogger
        if: ${{ inputs.variant == 'all' || inputs.variant == 'fabric-grieflogger-compatible' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (Fabric 1.21.1, GriefLogger 1.2.10 compatible)
          modrinth-version: '${{ steps.version_data.outputs.version }}+fabric-gl'
          modrinth-version-type: release
          modrinth-changelog-file: release-notes.md
          modrinth-game-versions: |
            1.21.1
          modrinth-loaders: |
            fabric
          modrinth-environment: dedicated-server
          modrinth-java: |
            21
          modrinth-dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}

      - name: Publish NeoForge standard build to Modrinth
        id: publish_neoforge
        if: ${{ inputs.variant == 'all' || inputs.variant == 'neoforge' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1)
          modrinth-version: '${{ steps.version_data.outputs.version }}+neoforge'
          modrinth-version-type: release
          modrinth-changelog-file: release-notes.md
          modrinth-game-versions: |
            1.21.1
          modrinth-loaders: |
            neoforge
          modrinth-environment: dedicated-server
          modrinth-java: |
            21
          modrinth-dependencies: |
            grieflogger(optional){modrinth:grieflogger}

      - name: Publish NeoForge GriefLogger-compatible build to Modrinth
        id: publish_neoforge_grieflogger
        if: ${{ inputs.variant == 'all' || inputs.variant == 'neoforge-grieflogger-compatible' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: itemgraph
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          modrinth-name: ItemGraph ${{ steps.version_data.outputs.version }} (NeoForge 1.21.1, GriefLogger 1.2.10 compatible)
          modrinth-version: '${{ steps.version_data.outputs.version }}+neoforge-gl'
          modrinth-version-type: release
          modrinth-changelog-file: release-notes.md
          modrinth-game-versions: |
            1.21.1
          modrinth-loaders: |
            neoforge
          modrinth-environment: dedicated-server
          modrinth-java: |
            21
          modrinth-dependencies: |
            grieflogger@1.2.10-1.21.1(required){modrinth:grieflogger}

      - name: Write publication summary
        if: ${{ always() }}
        shell: bash
        env:
          FABRIC_URL: ${{ steps.publish_fabric.outputs.modrinth-url }}
          FABRIC_GL_URL: ${{ steps.publish_fabric_grieflogger.outputs.modrinth-url }}
          NEOFORGE_URL: ${{ steps.publish_neoforge.outputs.modrinth-url }}
          NEOFORGE_GL_URL: ${{ steps.publish_neoforge_grieflogger.outputs.modrinth-url }}
        run: |
          {
            echo "## Modrinth publication results"
            echo
            echo "- Fabric: ${FABRIC_URL:-not published}"
            echo "- Fabric GriefLogger-compatible: ${FABRIC_GL_URL:-not published}"
            echo "- NeoForge: ${NEOFORGE_URL:-not published}"
            echo "- NeoForge GriefLogger-compatible: ${NEOFORGE_GL_URL:-not published}"
          } >> "${GITHUB_STEP_SUMMARY}"
