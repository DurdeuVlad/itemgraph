name: Build & Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-password
          MARIADB_DATABASE: itemgraph
          MARIADB_USER: itemgraph
          MARIADB_PASSWORD: itemgraph
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: itemgraph
          MYSQL_USER: itemgraph
          MYSQL_PASSWORD: itemgraph
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Validate GriefLogger compatibility profile
        env:
          GRIEFLOGGER_PROFILE_CHECK_REMOTE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_grieflogger_profile.py

      - name: Test GriefLogger validator input rejection
        run: python3 tools/test_grieflogger_validators.py

      - name: Test normalized differential replay report comparator
        run: python3 tools/test_itemgraph_differential_report.py

      - name: Test native GameTest report normalization
        run: python3 tools/test_normalize_itemgraph_gametest_report.py

      - name: Test ItemGraph performance report validation
        run: python3 tools/test_validate_itemgraph_performance_report.py

      - name: Validate exact GriefLogger 1.21.1 release fixture
        env:
          GRIEFLOGGER_RELEASE_FIXTURE_CHECK_REMOTE: '1'
        run: python3 tools/validate_grieflogger_release_fixture.py

      - name: Test all loaders without packaging distributable mod jars
        env:
          ITEMGRAPH_DIFFERENTIAL_REPORT_DIR: ${{ runner.temp }}/itemgraph-differential-reports/raw
          ITEMGRAPH_PERFORMANCE_REPORT_DIR: ${{ runner.temp }}/itemgraph-performance-reports/raw
          ITEMGRAPH_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/itemgraph
          ITEMGRAPH_TEST_MARIADB_USER: itemgraph
          ITEMGRAPH_TEST_MARIADB_PASSWORD: itemgraph
          ITEMGRAPH_TEST_MYSQL_URL: jdbc:mariadb://127.0.0.1:3307/itemgraph?allowPublicKeyRetrieval=true
          ITEMGRAPH_TEST_MYSQL_USER: itemgraph
          ITEMGRAPH_TEST_MYSQL_PASSWORD: itemgraph
        run: |
          mkdir -p "$ITEMGRAPH_DIFFERENTIAL_REPORT_DIR"
          mkdir -p "$ITEMGRAPH_PERFORMANCE_REPORT_DIR"
          ./gradlew :neoforge:test :neoforge:runGameTestServer :fabric:test :fabric:runGameTest

      - name: Normalize and validate native-only replay reports
        env:
          REPORT_DIR: ${{ runner.temp }}/itemgraph-differential-reports
        run: |
          mkdir -p "$REPORT_DIR/normalized"
          for loader in neoforge fabric; do
            python3 tools/normalize_itemgraph_gametest_report.py \
              --loader "$loader" \
              --input "$REPORT_DIR/raw/itemgraph-$loader.raw.json" \
              --output "$REPORT_DIR/normalized/itemgraph-$loader.json"
            python3 tools/itemgraph_differential_report.py \
              --validate-only "$REPORT_DIR/normalized/itemgraph-$loader.json" \
              --expected-system itemgraph \
              --expected-loader "$loader"
          done

      - name: Upload redacted replay reports
        uses: actions/upload-artifact@v4
        with:
          name: itemgraph-native-replay-reports
          path: ${{ runner.temp }}/itemgraph-differential-reports/normalized/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate redacted performance reports
        run: python3 tools/validate_itemgraph_performance_report.py --input-dir "${{ runner.temp }}/itemgraph-performance-reports/raw"

      - name: Upload redacted performance reports
        uses: actions/upload-artifact@v4
        with:
          name: itemgraph-performance-reports
          path: ${{ runner.temp }}/itemgraph-performance-reports/raw/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Reject invalid NeoForge server configuration before database startup
        run: python3 tools/test_neoforge_invalid_config_startup.py
