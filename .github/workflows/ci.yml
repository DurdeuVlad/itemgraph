name: Build & Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Read project version
        id: version_data
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate GriefLogger compatibility profile
        env:
          GRIEFLOGGER_PROFILE_CHECK_REMOTE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_grieflogger_profile.py

      - name: Test and build all loader artifacts
        run: ./gradlew clean build

      - name: Upload all server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itemgraph-server-artifacts
          path: |
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          if-no-files-found: error
