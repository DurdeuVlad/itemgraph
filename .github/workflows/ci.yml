name: Build & Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-password
          MARIADB_DATABASE: itemgraph
          MARIADB_USER: itemgraph
          MARIADB_PASSWORD: itemgraph
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: itemgraph
          MYSQL_USER: itemgraph
          MYSQL_PASSWORD: itemgraph
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Read project version
        id: version_data
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" {print $2; exit}' gradle.properties | tr -d '\r')"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate GriefLogger compatibility profile
        env:
          GRIEFLOGGER_PROFILE_CHECK_REMOTE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_grieflogger_profile.py

      - name: Validate exact GriefLogger 1.21.1 release fixture
        env:
          GRIEFLOGGER_RELEASE_FIXTURE_CHECK_REMOTE: '1'
        run: python3 tools/validate_grieflogger_release_fixture.py

      - name: Test and build all loader artifacts
        env:
          ITEMGRAPH_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/itemgraph
          ITEMGRAPH_TEST_MARIADB_USER: itemgraph
          ITEMGRAPH_TEST_MARIADB_PASSWORD: itemgraph
          ITEMGRAPH_TEST_MYSQL_URL: jdbc:mariadb://127.0.0.1:3307/itemgraph
          ITEMGRAPH_TEST_MYSQL_USER: itemgraph
          ITEMGRAPH_TEST_MYSQL_PASSWORD: itemgraph
        run: ./gradlew clean build

      - name: Upload all server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itemgraph-server-artifacts
          path: |
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-fabric-grieflogger-compatible.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge.jar
            build/libs/itemgraph-${{ steps.version_data.outputs.version }}-neoforge-grieflogger-compatible.jar
          if-no-files-found: error
