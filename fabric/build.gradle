plugins {
    id 'fabric-loom' version '1.10.5'
}

base {
    archivesName = rootProject.mod_id
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    include(modImplementation('me.lucko:fabric-permissions-api:0.3.1'))
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    include 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation "org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_connector_version}"
    include "org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_connector_version}"
    implementation project(':core')
    implementation project(':common').sourceSets.main.output

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

loom {
    mods {
        itemgraph {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
    runs {
        server {
            server()
            runDir '../run/fabric-server'
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'itemgraph-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

tasks.named('compileGametestJava') {
    source project(':common').fileTree('src/gametest/java')
}

tasks.withType(JavaCompile).configureEach {
    source project(':common').sourceSets.main.allSource
}

tasks.named('processResources', ProcessResources) {
    inputs.properties([
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_description: rootProject.mod_description,
            mod_authors: rootProject.mod_authors,
            mod_license: rootProject.mod_license,
            minecraft_version: rootProject.minecraft_version,
            fabric_minecraft_version_range: rootProject.fabric_minecraft_version_range,
            fabric_loader_version: rootProject.fabric_loader_version,
            fabric_api_version: rootProject.fabric_api_version
    ])
    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
    from project(':common').sourceSets.main.resources
}

tasks.named('jar') {
    archiveClassifier = 'dev'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    from project(':common').sourceSets.main.output
    from project(':core').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('remapJar') {
    archiveClassifier = 'fabric'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('verifyFabricJar') {
    group = 'verification'
    description = 'Checks loader metadata and packaged shared classes in the Fabric release jar.'
    dependsOn tasks.named('remapJar')

    doLast {
        def artifact = tasks.named('remapJar').get().archiveFile.get().asFile
        def expectedName = "${rootProject.mod_id}-${rootProject.mod_version}-fabric.jar"
        if (artifact.name != expectedName) {
            throw new GradleException("Expected Fabric jar ${expectedName}; got ${artifact.name}")
        }
        def archive = new java.util.zip.ZipFile(artifact)
        try {
            def names = java.util.Collections.list(archive.entries()).collect { it.name }
            def nestedSqlite = names.any { it.startsWith('META-INF/jars/sqlite-jdbc-') }
            def nestedMariaDb = names.any { it.startsWith('META-INF/jars/mariadb-java-client-') }
            if (!names.contains('fabric.mod.json')
                    || !names.contains('itemgraph.mixins.json')
                    || names.contains('META-INF/neoforge.mods.toml')
                    || !names.contains('com/itemgraph/fabric/ItemGraphFabric.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ProjectileMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/CommandsMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ServerLevelMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/BlockItemMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ServerPlayerMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ItemEntityMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/LivingEntityMixin.class')
                    || !names.contains('com/itemgraph/fabric/capture/LivingEntityUseCapture.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ItemStackMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/HopperBlockEntityMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ResultSlotMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/FurnaceResultSlotMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/AnvilMenuMixin.class')
                    || !names.contains('com/itemgraph/fabric/mixin/ItemCombinerMenuAccessor.class')
                    || !names.contains('com/itemgraph/query/TraceQueryService.class')
                    || !nestedSqlite
                    || !nestedMariaDb) {
                throw new GradleException("${artifact.name} is missing Fabric/shared classes or has incorrect JDBC driver bundling")
            }
            def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry('fabric.mod.json')))
            if (metadata.id != rootProject.mod_id
                    || metadata.version != rootProject.mod_version
                    || metadata.environment != 'server'
                    || metadata.depends.minecraft != rootProject.fabric_minecraft_version_range
                    || metadata.custom['mc-publish'].loaders != ['fabric']) {
                throw new GradleException("${artifact.name} has incorrect Fabric release metadata")
            }
            if (metadata.depends.grieflogger != null
                    || metadata.breaks?.grieflogger == null) {
                throw new GradleException("${artifact.name} must declare GriefLogger a hard conflict, not a dependency")
            }
        } finally {
            archive.close()
        }
        logger.lifecycle("Verified Fabric artifact: ${artifact.name}")
    }
}
