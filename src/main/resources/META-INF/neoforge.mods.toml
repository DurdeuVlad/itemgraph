modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/DurdeuVlad/itemgraph/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ItemGraph's own SQLite JDBC driver is NOT bundled (see build.gradle comment) -
# it relies on GriefLogger's bundled copy being present on the module path at
# runtime, in addition to being ItemGraph's primary evidence source.
[[dependencies.${mod_id}]]
    modId="grieflogger"
    type="required"
    reason="ItemGraph reads GriefLogger's evidence database and relies on its bundled sqlite-jdbc on the module path"
    versionRange="[1.2.10,)"
    ordering="AFTER"
    side="BOTH"
