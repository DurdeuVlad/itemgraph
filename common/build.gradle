plugins {
    id 'fabric-loom' version '1.10.5'
}

configurations {
    // Raw driver jar embedded at META-INF/iglibs/ and loaded in a private
    // classloader by com.itemgraph.db.SqliteJdbc so org.sqlite.* never sits on
    // the mod classpath; that is what lets GriefLogger (which embeds the same
    // package in its main jar) coexist with ItemGraph. Transitive deps (slf4j)
    // must not leak into the embedded lib dir.
    sqliteBundle {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    implementation project(':core')
    sqliteBundle "org.xerial:sqlite-jdbc:${rootProject.sqlite_jdbc_version}"
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'sqlite_jdbc_version', rootProject.sqlite_jdbc_version
    filesMatching('META-INF/iglibs/libs.properties') {
        expand sqlite_jdbc_version: rootProject.sqlite_jdbc_version
    }
    from({ configurations.sqliteBundle }) {
        into 'META-INF/iglibs'
    }
}

loom {
    runs {
        server {
            server()
            runDir '../run/common-server'
        }
    }
}

tasks.named('jar') {
    enabled = false
}
tasks.named('remapJar') {
    enabled = false
}

tasks.register('verifySharedLoaderBoundary') {
    group = 'verification'
    description = 'Rejects direct Fabric and NeoForge API imports from shared runtime code.'
    doLast {
        def forbidden = ~/^\s*import\s+(net\.neoforged\.|com\.neoforged\.|net\.fabricmc\.)/
        def offenders = fileTree('src/main/java').matching { include '**/*.java' }.files.findAll { source ->
            source.readLines().any { it ==~ forbidden }
        }
        if (!offenders.empty) {
            throw new GradleException("Shared loader boundary violation; forbidden imports found in: ${offenders}")
        }
    }
}
