pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'itemgraph'

include 'core', 'common', 'fabric', 'neoforge'

// These binary consumer fixtures intentionally compile against built mod JARs.
// Keep them out of unrelated unit-test configuration, and include them when a
// caller explicitly runs a fixture task after preparing its loader JAR input.
if (gradle.startParameter.taskNames.any { it.startsWith(':examples:') || it.startsWith('examples:') }) {
    include 'examples:api-consumer', 'examples:api-consumer-fabric'
}
