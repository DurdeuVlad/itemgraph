plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

def gameTestDirectory = providers.gradleProperty('itemgraphGameTestDirectory')
        .map { project.file(it) }
        .getOrElse(rootProject.file('build/gametest'))

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = rootProject.mod_id
}

neoForge {
    version = rootProject.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
            gameDirectory = gameTestDirectory
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
        }
    }
}

sourceSets.main.java.srcDir project(':common').file('src/gametest/java')

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation project(':core')
    implementation project(':common').sourceSets.main.output

    testImplementation project(':core')
    testImplementation files(project(':common').sourceSets.main.output)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'neoforge'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    from project(':common').sourceSets.main.output
    from project(':core').sourceSets.main.output
    exclude 'com/itemgraph/gametest/**'
    exclude 'data/itemgraph/structure/empty.nbt'
}

// jarJar strips the dependency from every dev-run classpath, but a dev run launches
// the mod from build/classes so the project's own jarJar contents never materialize
// — org.sqlite.JDBC then resolves only if some installed mod embeds it (GriefLogger
// does). Scan the dev run's mods dir for an embedded sqlite jar and put the driver
// on the dev classpath only when nothing provides it; adding it unconditionally
// alongside such a mod crashes module resolution (duplicate org.xerial.sqlitejdbc).
// The production jar is unaffected — it always uses the bundled jarJar copy.
// Override detection with -Pitemgraph.devSqliteProvided=true|false if needed.
def devSqliteProvided = providers.gradleProperty('itemgraph.devSqliteProvided')
        .map { it.toBoolean() }
        .orElse(provider {
            (file('run/mods').listFiles()?.findAll { it.name.endsWith('.jar') } ?: []).any { jar ->
                try {
                    new java.util.zip.ZipFile(jar).withCloseable { z ->
                        java.util.Collections.list(z.entries()).any {
                            it.name ==~ /META-INF\/(jarjar|jars)\/sqlite-jdbc-.*\.jar/
                        }
                    }
                } catch (Exception ignored) {
                    false
                }
            }
        })

if (!devSqliteProvided.get()) {
    dependencies {
        additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.46.1.0'
    }
}

dependencies {
    // Bundle sqlite-jdbc via NeoForge JarJar so ItemGraph is fully
    // self-sufficient. GriefLogger embeds SQLite in its main mod module, so
    // JarJar negotiation can never deduplicate it; the two mods cannot share a
    // classpath and mods.toml declares ItemGraph incompatible with GriefLogger.
    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version {
            prefer '3.46.1.0'
            require '[3.40.0.0,4.0.0.0)'
        }
    }

    jarJar(implementation("org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_connector_version}")) {
        version {
            prefer rootProject.mariadb_connector_version
            require '[3.5.0,4.0.0)'
        }
    }

    testImplementation "org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_connector_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def modMetadataProperties = [
    minecraft_version             : rootProject.minecraft_version,
    minecraft_version_range       : rootProject.minecraft_version_range,
    neo_version                   : rootProject.neo_version,
    neo_version_range             : rootProject.neo_version_range,
    loader_version_range          : rootProject.loader_version_range,
    mod_id                        : rootProject.mod_id,
    mod_name                      : rootProject.mod_name,
    mod_license                   : rootProject.mod_license,
    mod_version                   : rootProject.mod_version,
    mod_authors                   : rootProject.mod_authors,
    mod_description               : rootProject.mod_description,
    grieflogger_dependency_type   : 'incompatible',
    grieflogger_version_range     : '[0,)',
    grieflogger_dependency_reason : 'ItemGraph replaces GriefLogger; do not run both mods. Keep the GriefLogger database file for the read-only import configured by grieflogger_database_path.'
]

tasks.named('processResources', ProcessResources) {
    inputs.properties modMetadataProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand modMetadataProperties
    }
}

tasks.register('verifyNeoForgeJar') {
    group = 'verification'
    description = 'Checks that the NeoForge jar bundles its drivers and declares GriefLogger incompatible.'
    dependsOn tasks.named('jarJar')

    doLast {
        def standardArtifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def standardArchive = new java.util.zip.ZipFile(standardArtifact)
        try {
            def standardEntryNames = java.util.Collections.list(standardArchive.entries()).collect { it.name }
            if (!standardEntryNames.contains('META-INF/jarjar/metadata.json')
                    || !standardEntryNames.any { it.contains('sqlite-jdbc-') }
                    || !standardEntryNames.any { it.contains('mariadb-java-client-') }
                    || !standardEntryNames.contains('com/itemgraph/query/TraceQueryService.class')
                    || !standardEntryNames.contains('com/itemgraph/core/port/RuntimeInformationPort.class')) {
                throw new GradleException("${standardArtifact.name} must retain its standalone SQLite and MariaDB JarJar dependencies")
            }

            def standardMetadataEntry = standardArchive.getEntry('META-INF/neoforge.mods.toml')
            if (standardMetadataEntry == null) {
                throw new GradleException("${standardArtifact.name} is missing META-INF/neoforge.mods.toml")
            }
            def standardMetadata = standardArchive.getInputStream(standardMetadataEntry).getText('UTF-8')
            def standardGriefLoggerBlock = standardMetadata.split(/(?=\[\[dependencies\.)/).find { it.contains('modId="grieflogger"') }
            if (standardGriefLoggerBlock == null || !standardGriefLoggerBlock.contains('type="incompatible"')) {
                throw new GradleException("${standardArtifact.name} must declare GriefLogger incompatible")
            }

            if (!standardEntryNames.contains('itemgraph-neoforge.mixins.json')
                    || !standardEntryNames.contains('com/itemgraph/neoforge/mixin/ProjectileMixin.class')
                    || !standardEntryNames.contains('com/itemgraph/neoforge/mixin/ServerLevelMixin.class')) {
                throw new GradleException("${standardArtifact.name} must package the NeoForge projectile mixin")
            }
        } finally {
            standardArchive.close()
        }

        logger.lifecycle("Verified NeoForge artifact: ${standardArtifact.name}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
