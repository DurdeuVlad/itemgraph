modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/DurdeuVlad/itemgraph/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Path is absolute from the resource root (src/main/resources), per NeoForge's
# neoforge.mods.toml reference. logoBlur=false forces nearest-neighbour scaling
# on the mods list screen - the icon is hand-placed pixel art and the default
# (true, linear filtering) would smear it.
logoFile="itemgraph_icon.png"
logoBlur=false
description='''${mod_description}'''

[[mixins]]
config="itemgraph-neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ItemGraph coexists with GriefLogger: its SQLite driver is embedded at
# META-INF/iglibs/ and loaded in a private classloader, so it never collides
# with the org.sqlite.* copy inside the GriefLogger mod jar. Ordering AFTER
# lets GriefLogger create config/grieflogger/database.db before ItemGraph's
# server-start migration check reads it. The GriefLogger database is opened
# strictly read-only; ItemGraph never writes to it.
[[dependencies.${mod_id}]]
    modId="grieflogger"
    type="${grieflogger_dependency_type}"
    reason="${grieflogger_dependency_reason}"
    versionRange="${grieflogger_version_range}"
    ordering="${grieflogger_ordering}"
