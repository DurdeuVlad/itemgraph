modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/DurdeuVlad/itemgraph/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Path is absolute from the resource root (src/main/resources), per NeoForge's
# neoforge.mods.toml reference. logoBlur=false forces nearest-neighbour scaling
# on the mods list screen - the icon is hand-placed pixel art and the default
# (true, linear filtering) would smear it.
logoFile="itemgraph_icon.png"
logoBlur=false
description='''${mod_description}'''

[[mixins]]
config="itemgraph-neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ItemGraph REPLACES GriefLogger; the two mods must never be installed
# together. ItemGraph bundles sqlite-jdbc via JarJar while GriefLogger embeds
# org.sqlite.* in its main mod module, so the pair crashes Java module
# resolution at startup even before product-level conflicts are considered.
# Marking the dependency incompatible makes that failure an explicit, clean
# refusal instead of a module-resolution error. Migrating servers keep their
# GriefLogger database file: the read-only import bridge opens it through
# grieflogger_database_path once the GriefLogger mod jar itself is removed.
[[dependencies.${mod_id}]]
    modId="grieflogger"
    type="${grieflogger_dependency_type}"
    reason="${grieflogger_dependency_reason}"
    versionRange="${grieflogger_version_range}"
