plugins {
    id 'fabric-loom' version '1.10.5'
}

version = '0.1.0'
group = 'com.example'

def apiConsumerServerDir = layout.buildDirectory.dir('api-consumer-fabric-server').get().asFile
def apiConsumerResultFile = new File(apiConsumerServerDir, 'result.txt')

base {
    archivesName = 'itemgraph-api-consumer-fabric'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation files(rootProject.layout.buildDirectory.file(
            "libs/itemgraph-${rootProject.mod_version}-fabric.jar"))
}

loom {
    runs {
        server {
            server()
            runDir apiConsumerServerDir.absolutePath
            property 'itemgraph.api.consumer.result', apiConsumerResultFile.absolutePath
        }
    }
    mods {
        itemgraph_api_consumer_fabric {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn ':fabric:remapJar'
}

tasks.named('generateRemapClasspath') {
    dependsOn ':fabric:remapJar'
}

tasks.named('processResources', ProcessResources) {
    inputs.property('itemgraph_mod_version', rootProject.mod_version)
    filesMatching('fabric.mod.json') {
        expand(itemgraph_mod_version: rootProject.mod_version)
    }
}

tasks.named('runServer') {
    dependsOn ':fabric:remapJar'
    doFirst {
        apiConsumerServerDir.mkdirs()
        new File(apiConsumerServerDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        apiConsumerResultFile.delete()
    }
    doLast {
        if (!apiConsumerResultFile.isFile() || !apiConsumerResultFile.getText('UTF-8').startsWith('PASS:')) {
            throw new GradleException('Fabric API consumer fixture did not complete successfully')
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
