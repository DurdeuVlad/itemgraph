plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.1.0'
group = 'com.example'

base {
    archivesName = 'itemgraph-api-consumer'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = rootProject.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.layout.buildDirectory.dir('api-consumer-neoforge-server').get().asFile
            systemProperty 'itemgraph.api.consumer.result',
                    rootProject.layout.buildDirectory.file('api-consumer-neoforge-server/result.txt')
                    .get().asFile.absolutePath
        }
    }

    mods {
        itemgraph_api_consumer {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Contract under test: a consumer uses the public preview API from the built
    // ItemGraph mod JAR, not the project's source output or internal packages.
    compileOnly files(rootProject.layout.buildDirectory.file(
            "libs/itemgraph-${rootProject.mod_version}-neoforge.jar"))
    additionalRuntimeClasspath files(rootProject.layout.buildDirectory.file(
            "libs/itemgraph-${rootProject.mod_version}-neoforge.jar"))
}

tasks.named('processResources', ProcessResources) {
    inputs.property('itemgraph_mod_version', rootProject.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(itemgraph_mod_version: rootProject.mod_version)
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn ':neoforge:jar'
}

tasks.named('runServer') {
    dependsOn ':neoforge:jar'
    doFirst {
        def directory = rootProject.layout.buildDirectory.dir('api-consumer-neoforge-server').get().asFile
        directory.mkdirs()
        new File(directory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(directory, 'result.txt').delete()
    }
    doLast {
        def result = rootProject.layout.buildDirectory.file('api-consumer-neoforge-server/result.txt')
                .get().asFile
        if (!result.isFile() || !result.getText('UTF-8').startsWith('PASS:')) {
            throw new GradleException('NeoForge API consumer fixture did not complete successfully')
        }
    }
}
